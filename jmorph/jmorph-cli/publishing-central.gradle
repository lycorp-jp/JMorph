import com.vanniktech.maven.publish.JavaLibrary
import com.vanniktech.maven.publish.JavadocJar
import com.vanniktech.maven.publish.MavenPublishPlugin

buildscript {
    repositories {
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.vanniktech:gradle-maven-publish-plugin:0.34.0'
    }
}

apply plugin: MavenPublishPlugin

mavenPublishing {
    configure(new JavaLibrary(new JavadocJar.Javadoc(), true))
    publishToMavenCentral(true)
    signAllPublications()

    coordinates(project.group.toString(), project.name, project.version.toString())

    pom {
        name = 'JMorph CLI'
        description = 'Applications and examples for JMorph.'
        url = 'https://github.com/lycorp-jp/JMorph'

        licenses {
            license {
                name = 'Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
        }

        developers {
            developer {
                name = 'LY Corporation'
                url = 'https://www.lycorp.co.jp/'
            }
        }

        scm {
            url = 'https://github.com/lycorp-jp/JMorph'
            connection = 'scm:git:https://github.com/lycorp-jp/JMorph.git'
            developerConnection = 'scm:git:ssh://git@github.com/lycorp-jp/JMorph.git'
        }
    }
}
